<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>The Explorer’s Outpost</title><link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600;700&family=Libre+Baskerville:wght@400;700&display=swap" rel="stylesheet"><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#10271f}#world{position:fixed;inset:0;width:100%;height:100%;border:0}.journal-button{position:fixed;right:18px;top:16px;z-index:3;padding:10px 18px;border:1px solid #c7a977;border-radius:8px 12px 9px 11px;background:#18372de8;color:#f7e6c4;font:700 25px Caveat,cursive;cursor:pointer;box-shadow:0 5px 22px #0007}.veil{position:fixed;inset:0;background:#08180fba;display:none;align-items:center;justify-content:center;z-index:10;padding:12px}.veil.open{display:flex}.book-shell{width:min(96vw,1160px);height:min(88vh,760px);aspect-ratio:3/2;position:relative}.book{height:100%;width:100%;display:grid;grid-template-columns:1fr 1fr;padding:7.5% 7.3% 7.8% 12.3%;gap:5.5%;background:url('travelers-journal-art.png') center/100% 100% no-repeat;filter:drop-shadow(0 14px 25px #0008)}.page{overflow-y:auto;overflow-x:hidden;scrollbar-color:#ad8e61 transparent;scrollbar-width:thin;position:relative;color:#403123;padding:10px 12px 24px;background:transparent;border-radius:5px;box-shadow:none;min-height:0}.left{transform:rotate(-.25deg)}.right{transform:rotate(.25deg)}.eyebrow{font:700 11px Georgia,serif;letter-spacing:.13em;text-transform:uppercase;color:#826447}.script,h2,.entry strong,.duck-name,.color-clue-title{font-family:Caveat,cursive}h1{font:700 clamp(32px,4vw,52px)/.95 Caveat,cursive;margin:15px 0 12px}h2{font:700 40px/1 Caveat,cursive;margin:12px 0 18px}p{font:14px/1.7 'Libre Baskerville',Georgia,serif}.note{font:600 27px/1.2 Caveat,cursive;transform:rotate(-2deg)}.rule{border-top:1px solid #ab8b61;margin:22px 0}.foot{font:600 23px Caveat,cursive;margin-top:35px}.pressed{font-size:40px;opacity:.35}.tabs{display:flex;flex-wrap:wrap;gap:5px;margin:12px 0 20px}.tab{font:700 21px Caveat,cursive;background:#d3b587;border:1px solid #95754e;border-radius:4px 8px 5px 7px;color:#3e3022;padding:6px 10px;cursor:pointer}.tab[aria-selected=true]{background:#49624b;color:#fff2d7}.entry{border-top:1px solid #b79b71;padding:14px 0 8px;margin:14px 0}.entry strong{font-size:27px;line-height:1.1}.entry p{margin:7px 0 12px}.duck-clue,.color-clue{border-bottom:1px dashed #b79d78;padding:12px 0}.duck-check{display:flex;align-items:flex-start;gap:10px}.duck-name,.color-clue-title{font-size:25px;font-weight:700}.duck-description{font-size:12px;line-height:1.65;margin:3px 0 8px}.duck-status,.clue-count,.duck-progress,.color-instruction{font:600 19px Caveat,cursive;color:#655037}.object-checks{display:flex;gap:12px;flex-wrap:wrap;margin:8px 0}.object-check{font:600 19px Caveat,cursive;display:inline-flex;align-items:center;gap:5px}.page input[type=checkbox]{appearance:none;width:20px;height:20px;flex-shrink:0;border:2px solid #513e2a;border-radius:2px 4px 3px 3px;background:#f9e7c7;cursor:pointer;position:relative;margin:3px 0 0;transform:rotate(-3deg)}.page input[type=checkbox]:checked:after{content:'✓';position:absolute;left:1px;top:-9px;font:700 29px Caveat,cursive;color:#31533b}.found .duck-name{text-decoration:line-through;text-decoration-thickness:1px}.case-closed{margin:18px 0;padding:10px 12px;border:1px dashed #94734c;font:600 22px/1.2 Caveat,cursive;color:#35523b}.case-closed[hidden]{display:none}.close{position:absolute;right:0;top:-38px;z-index:4;border:1px solid #d2b581;border-radius:50%;background:#203c30;color:#f5e5c5;width:36px;height:36px;font-size:25px;cursor:pointer}.tab:focus-visible,.close:focus-visible,.journal-button:focus-visible,input:focus-visible{outline:3px solid #b87924;outline-offset:2px}
.world-intro{font-style:italic}.world-found-label{font:700 20px Caveat,cursive;color:#755738;margin-top:10px}.world-found{font-style:italic;margin-top:3px!important}.world-ending{font:600 23px Caveat,cursive;text-align:center;color:#755738;margin:26px 0}
@media(max-width:700px){.book-shell{width:min(98vw,500px);height:min(89vh,760px)}.book{display:block;padding:13% 13% 14% 17%;background-size:100% 100%;overflow-y:auto}.page{overflow:visible;margin:0 0 16px;padding:12px 10px;transform:none;background:#f0ddbaf5}.left{padding-bottom:22px;border-bottom:2px dashed #ab906b}.journal-button{font-size:22px;top:10px;right:10px}.close{top:-32px}h1{font-size:43px}}
.field-intro{font-style:italic;color:#66503b}.field-label{font:700 10px Georgia,serif;letter-spacing:.09em;color:#826447;margin-bottom:7px}.field-entry p{font-style:italic;margin:9px 0}.field-entry strong{display:block}
</style></head><body>
<iframe id="world" title="Explore Of Little Things and Faraway Places" src="https://endlesspaper.net/xp?id=83N1WaVYnKvRW" allow="fullscreen" allowfullscreen></iframe>
<button id="openJournal" class="journal-button" type="button" aria-haspopup="dialog" aria-controls="journal">✧ Traveler's Journal</button>
<div class="veil" id="journal" role="dialog" aria-modal="true" aria-labelledby="journalTitle" aria-hidden="true"><div class="book-shell"><button id="closeJournal" class="close" type="button" aria-label="Close journal">×</button><div class="book">
<section class="page left"><div class="eyebrow">A record of peculiar places</div><h1 id="journalTitle">Traveler's Journal</h1><p>Of Little Things and Faraway Places</p><div class="rule"></div><p class="note">Some places are easy to find.<br>Others are waiting to be noticed.</p><p>These pages contain notes gathered along the way. Take what you need, and keep your eyes open.</p><div class="foot">— A fellow traveler</div><span class="pressed" aria-hidden="true">❧</span></section>
<section class="page right"><div class="eyebrow">Turn to a section</div><nav class="tabs" aria-label="Journal sections"><button class="tab" data-section="discoveries" aria-selected="true">Discoveries</button><button class="tab" data-section="mysteries" aria-selected="false">Mysteries</button><button class="tab" data-section="worlds" aria-selected="false">Places</button><button class="tab" data-section="notes" aria-selected="false">Field Notes</button></nav><div id="sectionContent" aria-live="polite"></div></section>
</div></div></div>
<script>
const duckClues=[
 {id:'adventurer',title:'The Adventurer',clue:"The first duck wanted to see the city from above. He's found himself a lovely view, though his new perch is a little warmer than expected."},
 {id:'daydreamer',title:'The Daydreamer',clue:"The second duck found a peaceful place to rest. Surrounded by colorful blooms, he's perfectly content watching the world go by."},
 {id:'homebody',title:'The Homebody',clue:"The third duck quickly grew tired of exploring. Missing his bathtub, he searched for a little water and found an unexpected place to float."}
];
const colorClues=[
 {id:'garden',title:'A Fading Garden',clue:"A resident's garden isn't looking quite as lively as it once did. Two of their beloved plants have lost more than just their sparkle.",instruction:'Find 2 grey plants.',count:2},
 {id:'bird',title:'Odd Bird Out',clue:'Three little birds gathered for a morning splash, but one seems to have lost something rather important. Perhaps his colorful companions can help him find it.',instruction:'Find 1 grey bird.',count:1},
 {id:'laundry',title:'Washed Out',clue:'Laundry day has taken a strange turn! A few freshly washed belongings seem to have come out looking rather dull.',instruction:'Find 3 grey clothing items.',count:3},
 {id:'fruit',title:'Rotten Luck',clue:"Someone's fresh fruit has lost its cheerful colors. Two pieces look suspiciously different from the rest of the harvest.",instruction:'Find 2 grey fruits.',count:2},
 {id:'party',title:'Party Pooper',clue:'The decorations were ready, but something strange happened before the celebration began. A few festive favorites have faded completely.',instruction:'Find 3 grey party supplies.',count:3}
];
const colorKey='explorers-outpost.discovery-002.colors.v1';
let colorProgress={};
try{const saved=JSON.parse(localStorage.getItem(colorKey)||'{}');if(saved&&typeof saved==='object'){for(const clue of colorClues){colorProgress[clue.id]=Array.from({length:clue.count},(_,i)=>saved[clue.id]?.[i]===true)}}}catch(e){}
for(const clue of colorClues)if(!colorProgress[clue.id])colorProgress[clue.id]=Array(clue.count).fill(false);
const progressKey='explorers-outpost.discovery-001.ducks.v1';
let duckProgress={};
try{const saved=JSON.parse(localStorage.getItem(progressKey)||'{}');if(saved&&typeof saved==='object'&&!Array.isArray(saved)){for(const duck of duckClues)duckProgress[duck.id]=saved[duck.id]===true}}catch(e){/* Storage may be disabled. Checkboxes still work for this visit. */}
const content={
 discoveries:{title:'Discoveries',entries:[]},
 mysteries:{title:'Unsolved Mysteries',entries:[['Pages yet to be filled','Some questions do not have answers. Not yet, anyway.']]},
 worlds:{title:'World Directory',entries:[]},
 notes:{title:'Field Notes',entries:[]}
};
function addDuckDiscovery(){
 const wrapper=document.createElement('div');wrapper.className='entry';
 const heading=document.createElement('strong');heading.textContent='No. 001 — The Great Duck Escape';wrapper.append(heading);
 const intro=document.createElement('p');intro.textContent="I've encountered a rather peculiar situation in Bellwether. Three little bath-time companions have gone missing. Their owner insists they were here only moments ago, but I suspect these adventurous ducklings had other plans. I've gathered a few observations that might help us find them.";wrapper.append(intro);
 const count=document.createElement('div');count.className='duck-progress';count.setAttribute('aria-live','polite');wrapper.append(count);
 const list=document.createElement('div');wrapper.append(list);
 const ending=document.createElement('div');ending.className='case-closed';ending.textContent="Well, that settles it. Three ducks, three rather questionable decisions, and not a single one interested in returning to the bathtub. I'll consider this case closed.";wrapper.append(ending);
 function refresh(){const total=duckClues.filter(d=>duckProgress[d.id]).length;count.textContent=`Ducks accounted for: ${total} / ${duckClues.length}`;ending.hidden=total!==duckClues.length;}
 duckClues.forEach((duck,i)=>{
  const item=document.createElement('div');item.className='duck-clue';
  const label=document.createElement('label');label.className='duck-check';
  const input=document.createElement('input');input.type='checkbox';input.checked=!!duckProgress[duck.id];input.setAttribute('aria-label',`Mark ${duck.title} as found`);
  const words=document.createElement('span');const title=document.createElement('span');title.className='duck-name';title.textContent=`Clue ${i+1}: ${duck.title}`;
  const clue=document.createElement('p');clue.className='duck-description';clue.textContent=duck.clue;
  words.append(title,clue);label.append(input,words);item.append(label);
  const status=document.createElement('div');status.className='duck-status';item.append(status);
  function updateItem(){item.classList.toggle('found',input.checked);status.textContent=input.checked?'✓ Found and recorded':'';}
  input.addEventListener('change',()=>{duckProgress[duck.id]=input.checked;try{localStorage.setItem(progressKey,JSON.stringify(duckProgress))}catch(e){}updateItem();refresh()});
  updateItem();list.append(item);
 });
 refresh();sectionContent.append(wrapper);
}

function addColorDiscovery(){
 const wrapper=document.createElement('div');wrapper.className='entry';
 const heading=document.createElement('strong');heading.textContent='No. 002 — The Case of the Missing Colors';wrapper.append(heading);
 const intro=document.createElement('p');intro.textContent="Something peculiar is happening in Bellwether. I've begun noticing ordinary things losing their colors, seemingly without explanation. I've recorded five rather unusual cases around town. Perhaps you can help me make sense of them.";wrapper.append(intro);
 const count=document.createElement('div');count.className='duck-progress';count.setAttribute('aria-live','polite');wrapper.append(count);
 const list=document.createElement('div');wrapper.append(list);
 const ending=document.createElement('div');ending.className='case-closed';ending.textContent="Eleven curious objects, all drained of their color. I've accounted for every one, but I still cannot explain what happened. Perhaps Bellwether is hiding something stranger than I first suspected.";wrapper.append(ending);
 function refresh(){const total=colorClues.reduce((n,c)=>n+colorProgress[c.id].filter(Boolean).length,0);count.textContent=`Missing colors accounted for: ${total} / 11`;ending.hidden=total!==11;}
 colorClues.forEach((clue,i)=>{
  const item=document.createElement('div');item.className='color-clue';
  const title=document.createElement('div');title.className='color-clue-title';title.textContent=`Clue ${i+1}: ${clue.title}`;
  const description=document.createElement('p');description.className='duck-description';description.textContent=clue.clue;
  const instruction=document.createElement('div');instruction.className='color-instruction';instruction.textContent=clue.instruction;
  const checks=document.createElement('div');checks.className='object-checks';
  const status=document.createElement('div');status.className='clue-count';
  clue.count&&Array.from({length:clue.count},(_,j)=>{
   const label=document.createElement('label');label.className='object-check';
   const checkbox=document.createElement('input');checkbox.type='checkbox';checkbox.checked=colorProgress[clue.id][j];checkbox.setAttribute('aria-label',`${clue.title}: object ${j+1} found`);
   const labelText=document.createElement('span');labelText.textContent=clue.count===1?'Found':`No. ${j+1}`;
   label.append(checkbox,labelText);checks.append(label);
   checkbox.addEventListener('change',()=>{colorProgress[clue.id][j]=checkbox.checked;try{localStorage.setItem(colorKey,JSON.stringify(colorProgress))}catch(e){}updateStatus();refresh()});
  });
  function updateStatus(){const n=colorProgress[clue.id].filter(Boolean).length;status.textContent=n===clue.count?'✓ All found':`${n} of ${clue.count} found`}
  updateStatus();item.append(title,description,instruction,checks,status);list.append(item);
 });
 refresh();sectionContent.append(wrapper);
}
const worldEntries=[
 {name:'Bellwether',description:'A bustling little city with peculiar residents, curious happenings, and more secrets than its streets might suggest.',found:'Every journey begins somewhere. Mine began here, though I suspect Bellwether is far more than a starting point.'},
 {name:'Toadstool Falls',description:'An extraordinary forest where mushrooms tower overhead and the familiar becomes wonderfully strange.',found:"I discovered that not every television in Bellwether shows ordinary programs. One offered a view of a forest unlike any I'd seen. Naturally, I had to take a closer look."},
 {name:'Highhollow',description:'A city suspended high above the ground, where rooftops meet the clouds and the streets seem to defy reason.',found:"Another apartment. Another television. This time, instead of a forest, I found a city in the sky. I'm beginning to think Bellwether's residents have no idea what's hiding in their living rooms."}
];
function addWorldDirectory(){
 const intro=document.createElement('p');intro.className='world-intro';intro.textContent="I've learned that the strangest places are often hidden in the most ordinary things. Here are the worlds I've encountered along the way.";sectionContent.append(intro);
 for(const world of worldEntries){
  const entry=document.createElement('div');entry.className='entry world-entry';
  const name=document.createElement('strong');name.textContent=world.name;
  const description=document.createElement('p');description.textContent=world.description;
  const label=document.createElement('div');label.className='world-found-label';label.textContent='How I Found It';
  const found=document.createElement('p');found.className='world-found';found.textContent=world.found;
  entry.append(name,description,label,found);sectionContent.append(entry);
 }
 const ending=document.createElement('p');ending.className='world-ending';ending.textContent='More places remain to be discovered...';sectionContent.append(ending);
}
const fieldNotes=[
 {title:'A City of Little Things',location:'BELLWETHER',paragraphs:["I've spent quite some time wandering the streets of Bellwether. At first glance, it seems like an ordinary place. People go about their days, windows glow in the evenings, and somewhere, someone is always in a hurry.","But I've begun to notice something rather wonderful. The longer I look, the more there is to see."]},
 {title:'An Odd Way to Travel',location:'BELLWETHER',paragraphs:["I've heard of people getting lost in a good television program, but I never expected to take the expression quite so literally.","I'm beginning to suspect that the residents of Bellwether have no idea just how interesting their televisions really are."]},
 {title:'A Thought Before Leaving',location:'BELLWETHER',paragraphs:["It's strange how easily we overlook the things right in front of us. I wonder how many extraordinary places I've walked past without ever noticing.","Perhaps I'll take the long way home today."]}
];
function addFieldNotes(){
 const intro=document.createElement('p');intro.className='field-intro';intro.textContent='Not every peculiar thing is a mystery to solve. Some are simply worth remembering.';sectionContent.append(intro);
 fieldNotes.forEach((note,i)=>{
  const entry=document.createElement('article');entry.className='entry field-entry';
  const label=document.createElement('div');label.className='field-label';label.textContent=`ENTRY NO. ${String(i+1).padStart(3,'0')} · ${note.location}`;
  const title=document.createElement('strong');title.textContent=note.title;
  entry.append(label,title);
  for(const paragraph of note.paragraphs){const p=document.createElement('p');p.textContent=paragraph;entry.append(p)}
  sectionContent.append(entry);
 });
}
const dialog=document.getElementById('journal'),openBtn=document.getElementById('openJournal'),closeBtn=document.getElementById('closeJournal'),sectionContent=document.getElementById('sectionContent');
function showSection(name){const section=content[name];sectionContent.replaceChildren();const h=document.createElement('h2');h.textContent=section.title;sectionContent.append(h);if(name==='discoveries'){addDuckDiscovery();addColorDiscovery();}if(name==='worlds')addWorldDirectory();if(name==='notes')addFieldNotes();for(const [heading,body] of section.entries){const div=document.createElement('div');div.className='entry';const strong=document.createElement('strong');strong.textContent=heading;const p=document.createElement('p');p.textContent=body;div.append(strong,p);sectionContent.append(div)}document.querySelectorAll('.tab').forEach(b=>b.setAttribute('aria-selected',String(b.dataset.section===name)))}
function setOpen(isOpen){dialog.classList.toggle('open',isOpen);dialog.setAttribute('aria-hidden',String(!isOpen));if(isOpen)closeBtn.focus();else openBtn.focus()}
openBtn.addEventListener('click',()=>setOpen(true));closeBtn.addEventListener('click',()=>setOpen(false));document.querySelectorAll('.tab').forEach(b=>b.addEventListener('click',()=>showSection(b.dataset.section)));dialog.addEventListener('click',e=>{if(e.target===dialog)setOpen(false)});document.addEventListener('keydown',e=>{if(e.key==='Escape'&&dialog.classList.contains('open'))setOpen(false);if(e.key==='Tab'&&dialog.classList.contains('open')){const focusables=[closeBtn,...dialog.querySelectorAll('.tab')];const first=focusables[0],last=focusables.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}});showSection('discoveries');
</script>
</body></html>
